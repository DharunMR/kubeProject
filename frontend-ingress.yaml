apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: movie-ingress
  labels:
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"

spec:
  ingressClassName: nginx
  rules:
  - host: woljinx.xyz
    http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: frontendservice
            port: 
              number: 80
