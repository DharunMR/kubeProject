apiVersion: apps/v1
kind: Deployment
metadata: 
  name: backendapp
  labels:
    app: backendapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backendapp

  template:
    metadata:
      labels:
        app: backendapp

    spec:
      containers:
      - name: backendapp
        image: dharun0406/movie-backend
        imagePullPolicy: Always

        ports:
        - name: backendapp-port
          containerPort: 8080

        envFrom:
        - secretRef:
            name: backend-secret

      initContainers:
      - name: moviedb
        image: busybox
        command: ["sh", "-c"]
        args:
          - |
            until nslookup moviedb-service.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do
              echo "waiting for MongoDB service";
              sleep 2;
            done;
